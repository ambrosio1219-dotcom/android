<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 예제 - 마우스를 올리면 이미지 바뀌기</title>
    <!-- 파비콘: 브라우저 탭에 보이는 작은 아이콘 -->
    <link rel="icon" type="image/png" sizes="32x32" href="../image/favicon.png">
    <link rel="shortcut icon" href="../image/favicon.ico">
    <link rel="apple-touch-icon" href="../image/apple-touch-icon.png">
    <style>
        /* 동작하는 것만 보여 주는 화면이라 꾸밈은 최소로 둔다 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 이미지를 화면 가운데에 놓는다 */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f6f7f1;
            font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
        }

        .back {
            position: fixed;
            top: 16px;
            left: 16px;
            padding: 10px 16px;
            color: white;
            background-color: #1e3a1a;
            border-radius: 999px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .back:hover {
            background-color: #2f6b2a;
        }

        /* 이미지는 자바스크립트가 바꾸므로 여기에는 크기와 그림자만 적는다 */
        #hover-img {
            display: block;
            width: 260px;
            max-width: 86vw;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(31, 58, 18, 0.12);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <a class="back" href="2th5.html">&larr; 홈으로</a>

    <img id="hover-img" src="../image/btn-off.png" alt="마우스를 올려 보세요">

    <script>
        var hoverImg = document.getElementById("hover-img");

        var OFF_IMG = "../image/btn-off.png";   // 평소에 보이는 이미지
        var ON_IMG = "../image/btn-on.png";     // 마우스를 올렸을 때 보이는 이미지

        // 바뀔 이미지를 미리 받아 둔다. 그래야 처음 올릴 때도 바로 바뀐다.
        var preload = new Image();
        preload.src = ON_IMG;

        // 마우스가 이미지 위로 올라올 때
        hoverImg.addEventListener("mouseover", function () {
            hoverImg.src = ON_IMG;
            hoverImg.alt = "이미지가 바뀌었어요!";
        });

        // 마우스가 이미지에서 벗어날 때 (휴대폰에서는 화면을 누르면 올린 것으로 본다)
        hoverImg.addEventListener("mouseout", function () {
            hoverImg.src = OFF_IMG;
            hoverImg.alt = "마우스를 올려 보세요";
        });
    </script>
</body>
</html>
