<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로또 번호 생성기</title>
<!-- 화면 꾸미기(색, 공 모양, 애니메이션, 차트)는 lotto.css에 있음 -->
<link rel="stylesheet" href="lotto.css">
</head>
<body>

<!-- ======================= 1. 번호 생성기 ======================= -->
<main class="card">
  <h1 class="title">로또 번호 생성기</h1>
  <p class="desc">1부터 45까지 숫자 중 겹치지 않는 6개를 뽑아 드려요.</p>

  <!--
    뽑기 방식 선택. name이 같은 라디오 버튼이라 둘 중 하나만 고를 수 있다.
    value 값('weighted' / 'random')을 lotto.js의 getSelectedMode()가 읽는다.
  -->
  <fieldset class="mode">
    <legend class="sr-only">뽑기 방식</legend>
    <label class="mode-option">
      <input type="radio" name="mode" value="weighted" checked>
      <span>많이 나온 번호 위주</span>
    </label>
    <label class="mode-option">
      <input type="radio" name="mode" value="random">
      <span>완전 무작위</span>
    </label>
  </fieldset>
  <!-- 고른 방식에 대한 한 줄 설명 (lotto.js의 updateModeHelp()가 채움) -->
  <p id="modeHelp" class="mode-help"></p>

  <!--
    공 6개가 그려지는 자리.
    처음에는 비어 있고, lotto.js의 renderEmpty()가 "?" 공 6개를 채워 넣는다.
    aria-live="polite": 내용이 바뀌면 화면 낭독기가 새 번호를 읽어 준다.
  -->
  <div id="balls" class="balls" aria-live="polite"></div>
  <p class="hint">공 아래 숫자는 그 번호가 지금까지 당첨번호로 나온 횟수예요.</p>

  <!-- 생성 횟수 표시. 숫자 부분(id="count")만 lotto.js에서 바꾼다. -->
  <p class="count">생성 횟수 <strong id="count">0</strong>회</p>

  <div class="buttons">
    <!-- 번호 뽑기: 누를 때마다 새 번호 6개를 뽑고 생성 횟수를 1 올린다. -->
    <button type="button" id="drawBtn" class="btn btn-primary">번호 뽑기</button>
    <!-- 초기화: 공을 "?" 상태로 되돌리고 생성 횟수를 0으로 만든다. -->
    <button type="button" id="resetBtn" class="btn">초기화</button>
  </div>
</main>

<!-- ======================= 2. 역대 당첨번호 분석 ======================= -->
<!-- 안의 빈 칸들은 모두 lotto-stats.js의 renderStats()가 채운다. -->
<section class="card stats" aria-labelledby="statsTitle">
  <h2 id="statsTitle" class="section-title">역대 당첨번호 분석</h2>
  <p id="statsRange" class="desc"></p>

  <h3 class="sub-title">많이 나온 번호 TOP 6</h3>
  <div id="topBalls" class="balls small"></div>

  <h3 class="sub-title">적게 나온 번호 6</h3>
  <div id="bottomBalls" class="balls small"></div>

  <h3 class="sub-title">번호별 출현 횟수</h3>
  <!-- 범례: 차트의 색과 선이 무엇을 뜻하는지 -->
  <div class="legend">
    <span class="legend-item"><i class="key key-top"></i>많이 나온 TOP 6</span>
    <span class="legend-item"><i class="key key-rest"></i>나머지 번호</span>
    <span class="legend-item"><i class="key key-avg"></i><span id="legendAvg">평균</span></span>
  </div>

  <!--
    막대 차트. 가로 2칸 × 세로 2칸 격자로 배치한다.
      [세로축 눈금 chartY] [막대 영역 chartPlot]
      [빈 칸            ] [가로축 번호 chartX  ]
    chartPlot은 tabindex="0"이라 Tab 키로 들어갈 수 있고, ← → 키로 번호를 옮겨 볼 수 있다.
  -->
  <div class="chart">
    <div id="chartY" class="chart-y" aria-hidden="true"></div>
    <div id="chartPlot" class="chart-plot" tabindex="0"
         aria-label="번호별 출현 횟수 막대 차트. 왼쪽, 오른쪽 화살표 키로 번호를 옮겨 볼 수 있어요. 같은 내용을 아래 표에서도 볼 수 있어요.">
      <div id="chartGrid" class="chart-grid"></div>
      <div id="chartBars" class="chart-bars"></div>
      <div id="chartAvg" class="chart-avg"></div>
      <div id="chartTip" class="chart-tip" role="status" hidden></div>
    </div>
    <div></div>
    <div id="chartX" class="chart-x" aria-hidden="true"></div>
  </div>

  <!-- 차트와 같은 값을 글자로 보는 표. 누르면 펼쳐진다. -->
  <details class="table-view">
    <summary>번호별 횟수 표로 보기</summary>
    <table>
      <thead>
        <tr><th scope="col">번호</th><th scope="col">출현 횟수</th><th scope="col">평균과 차이</th></tr>
      </thead>
      <tbody id="statsTable"></tbody>
    </table>
  </details>

  <!-- 분석으로 알 수 있는 사실 (숫자는 데이터에서 계산해 채움) -->
  <div class="note">
    <strong>알아 두세요</strong>
    <ul id="statsNote"></ul>
  </div>
</section>

<!--
  자바스크립트는 순서가 중요하다.
  1) lotto-data.js  : 역대 당첨번호 데이터
  2) lotto-stats.js : 분석 함수들 (데이터를 써야 하므로 데이터 다음)
  3) lotto.js       : 번호 뽑기 + 페이지 시작 (분석 함수를 불러 쓰므로 맨 마지막)
  body 맨 끝에 두어야 위의 태그들을 id로 찾을 수 있다.
-->
<script src="lotto-data.js"></script>
<script src="lotto-stats.js"></script>
<script src="lotto.js"></script>
</body>
</html>
